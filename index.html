<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4E9D3">
<title>噗噗专属菜单</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.font.im">
<link href="https://fonts.font.im/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<script>
(function(){
  var urls=[
    'https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js',
    'https://cdn.bootcdn.net/ajax/libs/mqtt/5.10.1/mqtt.min.js',
    'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'
  ];
  function tryLoad(i){
    if(i>=urls.length)return;
    var s=document.createElement('script');
    s.src=urls[i];s.onerror=function(){tryLoad(i+1);};
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>
<style>
:root{
  --bg:#F4E9D3;--card:#FFFDF7;--primary:#A07757;--pl:#C9A87C;
  --text:#5C3D28;--tl:#9B8068;--tl2:#C4B5A4;--border:#E8DCC6;
  --danger:#D4845C;--ok:#7BAE7F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-bottom:44px;-webkit-tap-highlight-color:transparent;
  position:relative;
}
body::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background-image:url('paw.png?v=25');background-repeat:repeat;
  background-size:90px;opacity:.05;
}
header{
  position:relative;z-index:1;max-width:1100px;margin:0 auto;
  padding:12px 20px 4px;display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.logo .logo-title{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:22px;font-weight:400;color:var(--primary);line-height:1.2;letter-spacing:1px}
.logo .logo-sub{font-size:11px;font-weight:400;color:var(--tl2);letter-spacing:1px;margin-top:2px;text-align:left}
.logo .logo-sub::before,.logo .logo-sub::after{content:'\1F33F';margin:0 5px;opacity:.7;font-size:10px}
.header-right{display:flex;align-items:center;gap:8px}
.sync-btn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:14px;position:relative;flex-shrink:0;
}
.sync-btn .dot{
  position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;
  border:1.5px solid var(--card);
}
.sync-btn .dot.green{background:var(--ok)}
.sync-btn .dot.yellow{background:#E8B84D}
.sync-btn .dot.red{background:var(--danger)}
.btn-add{
  background:var(--primary);color:#fff;border:none;border-radius:20px;
  padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}
.search-bar{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 20px 6px}
.search-bar input{
  width:100%;padding:10px 18px;border:1.5px solid var(--border);
  border-radius:22px;background:var(--card);font-size:14px;font-family:inherit;
  color:var(--text);outline:none;
}
.cat-bar{
  position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 20px 6px;
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:center;
}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{
  white-space:nowrap;padding:6px 10px 6px 14px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--card);font-size:13px;font-weight:600;color:var(--text);
  cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px;
}
.cat-chip .cnt{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:18px;padding:0 6px;border-radius:10px;
  background:#F0E6D2;color:var(--tl);font-size:11px;font-weight:500;
}
.cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.cat-chip.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.cat-edit{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--border);
  background:transparent;color:var(--tl);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#content{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:8px 20px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.dcard{
  background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;position:relative;transition:transform .15s;
}
.dcard:active{transform:scale(.97)}
.dphoto{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.dph{
  width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:36px;background:linear-gradient(135deg,#F0E6D2,#E8DCC6);
}
.dinfo{padding:8px 10px}
.dname{font-size:14px;font-weight:600;margin-bottom:1px}
.dcat{font-size:11px;color:var(--tl)}
.ddesc{font-size:11px;color:var(--tl);margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dtags{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.dtag{font-size:9px;padding:1px 6px;border-radius:8px;background:#F0E6D2;color:var(--tl)}
.card-btns{position:absolute;top:5px;right:5px;display:flex;gap:3px;z-index:2}
.card-btn{
  width:24px;height:24px;border-radius:50%;border:none;
  background:rgba(0,0,0,.25);color:#fff;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);transition:all .15s;
}
.card-btn:active{transform:scale(.88)}
.card-btn.menu-in{background:rgba(160,119,87,.82)}
.mv{background:var(--card);border:2px solid #8B6914;border-radius:16px;padding:18px;margin-top:6px}
.mv h2{font-size:22px;color:var(--primary);text-align:center;margin-bottom:4px;font-weight:700}
.mv-sub{text-align:center;font-size:12px;color:var(--tl2);margin-bottom:14px;letter-spacing:1px}
.mv-sub::before,.mv-sub::after{content:'\1F33F';margin:0 6px;opacity:.7;font-size:11px}
/* 菜单标题图片 */
.menu-title-img{
  display:block;
  margin:0 auto 10px;
  width:300px;
  height:auto;
  pointer-events:none;
}
/* 菜单左上角的猫装饰 */
.menu-cat{
  position:absolute;
  top:19px;
  left:18px;
  width:13vw;
  max-width:85px;
  min-width:60px;
  height:auto;
  z-index:10;
  pointer-events:none;
}
/* 菜单底部的仰躺猫 */
.menu-cat-bottom{
  display:block;
  margin:6px auto 0;
  width:75px;
  height:auto;
  pointer-events:none;
}
.menu-title{text-align:center;font-family:'Ma Shan Zheng','ZCOOL XiaoWei',cursive;font-size:28px;font-weight:400;color:var(--primary);margin:4px 0 14px;letter-spacing:4px}
.menu-toolbar{display:flex;justify-content:center;align-items:center;gap:10px;max-width:680px;margin:0 auto 10px;padding:0 16px}
.menu-clear-btn{background:rgba(180,90,60,.1);color:#a85a3c;border:1.5px solid rgba(180,90,60,.3);padding:6px 16px;border-radius:18px;font-size:13px;cursor:pointer;font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;letter-spacing:1px;transition:all .2s}
.menu-clear-btn:hover{background:rgba(180,90,60,.2)}
.msec{margin-bottom:14px}
.mst{font-family:'ZCOOL XiaoWei',serif;font-size:22px;font-weight:400;color:var(--primary);padding-bottom:5px;text-align:center;margin-bottom:6px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:10px}
.mst-line{flex:1;max-width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent)}
.mst-diamond{color:#8B6914;font-size:12px;flex-shrink:0}
.mst-text{flex-shrink:0}
.mi{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid #F5EDDE;cursor:pointer}
.mi:last-child{border-bottom:none}
.min{font-size:16px;font-weight:500}
.mid{font-size:11px;color:var(--tl);margin-top:2px}
.mit{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.mit span{font-size:9px;padding:1px 5px;border-radius:8px;background:#F0E6D2;color:var(--tl)}
.mi-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;margin-left:8px}
.empty{text-align:center;padding:50px 20px;color:var(--tl)}
.empty img{width:90px;height:90px;border-radius:50%;margin-bottom:10px;opacity:.8}
.empty h3{font-size:17px;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px;margin-bottom:14px}
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,253,247,.97);
  border-top:1px solid var(--border);display:flex;z-index:50;
  padding:2px 0 calc(2px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;border:none;background:transparent;font-family:inherit;font-size:10px;
  color:var(--tl);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:1px;padding:2px 0;
}
.tab-icon{font-size:16px;line-height:1}
.tab.active{color:var(--primary)}
.fab{
  position:fixed;bottom:50px;right:16px;width:54px;height:54px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--primary);cursor:pointer;
  box-shadow:0 4px 14px rgba(160,119,87,.28);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:5px;transition:transform .15s;
}
.fab:active{transform:scale(.9)}
.fab img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.modal-bg{
  position:fixed;inset:0;background:rgba(92,61,40,.5);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  visibility:hidden;opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.modal-bg.show{visibility:visible;opacity:1;pointer-events:auto}
.modal{
  background:var(--card);width:100%;max-width:500px;border-radius:18px 18px 0 0;
  padding:18px 18px 72px;max-height:90vh;overflow-y:auto;
}
.modal h3{font-size:17px;margin-bottom:10px;color:var(--primary);padding-right:24px}
.modal h3:empty{display:none}
.modal-x{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;border:none;background:#F0E6D2;color:var(--tl);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.modal-x:hover{background:#E8DCC6}
.modal{position:relative}
.view-dish-photo{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:12px;display:block}
.view-dish-photo-placeholder{width:100%;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#F0E6D2,#E8DCC6);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:12px}
.view-dish-name{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.view-dish-cat{font-size:13px;color:var(--tl);margin-bottom:12px}
.view-dish-desc{font-size:14px;line-height:1.7;color:var(--text);background:#FAF5EC;border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.view-dish-desc-label{font-size:12px;color:var(--tl);margin-bottom:4px;font-weight:600}
.confirm-msg{font-size:14px;line-height:1.6;color:var(--text);padding:8px 0 4px}
.modal label{display:block;font-size:11px;color:var(--tl);margin-bottom:3px;margin-top:8px}
.modal input,.modal textarea{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;
}
.modal textarea{resize:vertical;min-height:50px}
.catmgr-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;margin-top:8px}
.catmgr-row{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#FAF5EC;border-radius:10px}
.catmgr-order{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.catmgr-order button{width:24px;height:18px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--tl);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.catmgr-order button:disabled{opacity:.3;cursor:default}
.catmgr-order button:not(:disabled):active{background:var(--primary);color:#fff}
.catmgr-input{flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:13px;font-family:inherit;color:var(--text);outline:none}
.catmgr-cnt{font-size:11px;color:var(--tl);flex-shrink:0}
.catmgr-del{width:26px;height:26px;border-radius:50%;border:none;background:#F0E6D2;color:var(--tl);cursor:pointer;font-size:13px;flex-shrink:0}
.catmgr-del:hover{background:var(--danger);color:#fff}
.catmgr-add{margin-top:4px;padding:8px;border:1.5px dashed var(--border);border-radius:10px;background:transparent;color:var(--tl);cursor:pointer;font-size:13px;font-family:inherit}
.dcard.dragging{opacity:.7;transform:scale(1.03);z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:none}
.dcard.drag-placeholder{opacity:.3}
.photo-preview{
  margin-top:6px;width:100%;aspect-ratio:16/9;border-radius:10px;border:1.5px dashed var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  background:#FAF5EC;font-size:13px;color:var(--tl);
}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:10px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-cancel{background:#F0E6D2;color:var(--tl)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--tl)}
.random-modal{
  position:fixed;inset:0;background:rgba(92,61,40,.6);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  visibility:hidden;opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.random-modal.show{visibility:visible;opacity:1;pointer-events:auto}
.random-card{
  background:var(--card);border-radius:18px;padding:22px;max-width:320px;width:100%;
  text-align:center;animation:pop .3s ease;
}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.random-card img{width:110px;height:110px;border-radius:50%;object-fit:cover;margin-bottom:10px}
.random-card .rph{width:110px;height:110px;border-radius:50%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#F0E6D2,#E8DCC6)}
.random-card .rname{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.random-card .rcat{font-size:12px;color:var(--tl);margin-bottom:14px}
.random-btns{display:flex;gap:8px}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(92,61,40,.85);color:#fff;padding:8px 20px;border-radius:20px;
  font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}
.sync-status{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAF5EC;border-radius:12px;margin-bottom:12px;font-size:13px}
.sync-status .sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sync-status .sdot.green{background:var(--ok)}
.sync-status .sdot.yellow{background:#E8B84D;animation:pulse 1.5s infinite}
.sync-status .sdot.red{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-status .stext{flex:1;color:var(--text)}
.sync-status .sroom{font-size:11px;color:var(--tl2);font-family:monospace}
.sync-tip{font-size:12px;color:var(--tl);line-height:1.6;background:#FAF5EC;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.sync-tip b{color:var(--primary)}
.room-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.room-row input{flex:1;font-family:monospace;font-size:13px}
.room-row button{white-space:nowrap;padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--primary);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.mini-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);color:var(--tl);font-size:12px;cursor:pointer;font-family:inherit}
@media(max-width:600px){
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
  header{padding:10px 14px 4px}
  .search-bar{padding:0 14px 4px}
  .cat-bar{padding:0 14px 4px}
  #content{padding:6px 14px}
  .fab{width:48px;height:48px;bottom:46px;right:12px}
}
</style>
</head>
<body>

      <label>分类</label>
      <input type="text" id="dishCat" list="catList" placeholder="选择或输入分类">
      <datalist id="catList"></datalist>
      <label>做法</label>
      <textarea id="dishDesc" placeholder="记录做法步骤、食材用量..."></textarea>
      <label>标签（逗号分隔）</label>
      <input type="text" id="dishTags" placeholder="如: 快手, 下饭">
    </div>
    <div id="customBody"></div>
    <div class="modal-btns" id="modalBtns">
      <button class="btn btn-danger" id="delBtn" style="display:none" onclick="deleteDishFromModal()">删除</button>
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveDish()">保存</button>
    </div>
  </div>
</div>
<div class="random-modal" id="randomModal" onclick="if(event.target===this)closeRandom()"><div class="random-card" id="randomCard"></div></div>
<div class="toast" id="toast"></div>
<script>
// ===== State =====
var dishes=[], categories=['主菜','配菜','汤品','主食','凉菜','甜品'], deletedIds=[];
var currentView='grid', currentCat='', editingId=null, currentPhoto='';
var currentRandomId=null;
// ===== Sync State =====
var mqttClient=null, syncStatus='disconnected', roomId='', senderId='';
var syncTimeout=null, isPushing=false, lastIncomingTs=0;
// ===== Constants =====
var APP_VERSION=31;
var MQTT_URL='wss://broker.emqx.io:8084/mqtt';
var STORAGE_KEY='pupumenu_v24';

// ===== Utils =====
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showOverlay(el){
  el.classList.add('show');
}
function hideOverlay(el){
  el.classList.remove('show');
}
function toast(msg){
  var t=$('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.classList.remove('show')},1800);
}
function getSenderId(){
  if(senderId)return senderId;
  senderId=localStorage.getItem('device_id');
  if(!senderId){senderId='d'+Math.random().toString(36).substr(2,9);localStorage.setItem('device_id',senderId)}
  return senderId;
}
function genRoomId(){
  var adj=['软软','糯糯','团团','圆圆','暖暖','甜甜','香香','萌萌','咕咕','咩咩'];
  var n=Math.floor(Math.random()*900)+100;
  return adj[Math.floor(Math.random()*adj.length)]+n;
}
function getRoomId(){
  // URL param takes priority (for sharing via link)
  var urlParams=new URLSearchParams(window.location.search);
  var urlRoom=urlParams.get('room');
  if(urlRoom){roomId=urlRoom;localStorage.setItem('room_id',roomId);return roomId}
  if(!roomId){
    roomId=localStorage.getItem('room_id');
    if(!roomId){roomId=genRoomId();localStorage.setItem('room_id',roomId)}
  }
  return roomId;
}
function getTopic(){return 'pupumenu/menu/'+getRoomId()+'/state'}

// ===== Storage =====
function loadData(){
  var defaultCats=['主菜','配菜','汤品','主食','凉菜','甜品'];
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      var d=JSON.parse(raw);
      dishes=d.dishes||[];
      categories=(Array.isArray(d.categories)&&d.categories.length>0)?d.categories:defaultCats;
      deletedIds=d.deletedIds||[];
      return;
    }
  }catch(e){}
  try{dishes=JSON.parse(localStorage.getItem('dishes_v2')||'[]')}catch(e){dishes=[]}
  try{
    var oldCats=JSON.parse(localStorage.getItem('cats_v2')||'null');
    categories=(Array.isArray(oldCats)&&oldCats.length>0)?oldCats:defaultCats;
  }catch(e){categories=defaultCats}
  try{deletedIds=JSON.parse(localStorage.getItem('dels_v2')||'[]')}catch(e){deletedIds=[]}
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      dishes:dishes,categories:categories,deletedIds:deletedIds
    }));
  }catch(e){
    // Storage full — strip oldest photos
    console.log('[Storage] Full, stripping old photos');
    var sorted=dishes.slice().sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
    for(var i=0;i<sorted.length&&i<5;i++){if(sorted[i].photo)sorted[i].photo=null}
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        dishes:dishes,categories:categories,deletedIds:deletedIds
      }));
    }catch(e2){console.log('[Storage] Still full')}
  }
}

// ===== Render =====
function renderAll(){renderCats();renderContent()}
function renderCats(){
  var total=dishes.filter(function(d){return deletedIds.indexOf(d.id)<0}).length;
  var html='<button class="cat-chip'+(currentCat===''?' active':'')+'" onclick="selectCat(\'\')">🐾 全部 <span class="cnt">'+total+'</span></button>';
  categories.forEach(function(c){
    var cnt=dishes.filter(function(d){return deletedIds.indexOf(d.id)<0&&d.category===c}).length;
    html+='<button class="cat-chip'+(currentCat===c?' active':'')+'" onclick="selectCat(\''+esc(c)+'\')">'+esc(c)+' <span class="cnt">'+cnt+'</span></button>';
  });
  html+='<button class="cat-edit" onclick="openCatMgr()" title="管理分类">＋</button>';
  $('catBar').innerHTML=html;
  var dl=$('catList');dl.innerHTML='';
  categories.forEach(function(c){dl.innerHTML+='<option value="'+esc(c)+'">'});
}
function openCatMgr(){
  var html='<div class="catmgr-list">';
  categories.forEach(function(c,i){
    var cnt=dishes.filter(function(d){return deletedIds.indexOf(d.id)<0&&d.category===c}).length;
    html+='<div class="catmgr-row">'+
      '<div class="catmgr-order">'+
        '<button onclick="moveCat('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button>'+
        '<button onclick="moveCat('+i+',1)" '+(i===categories.length-1?'disabled':'')+'>↓</button>'+
      '</div>'+
      '<input type="text" value="'+esc(c)+'" data-idx="'+i+'" class="catmgr-input">'+
      '<span class="catmgr-cnt">'+cnt+'道</span>'+
      '<button class="catmgr-del" onclick="deleteCat('+i+')" title="删除分类">×</button>'+
    '</div>';
  });
  html+='<button class="catmgr-add" onclick="addCatRow()">＋ 添加新分类</button>';
  html+='</div>';
  showModal('分类管理',html,[
    {txt:'取消',cls:'btn-cancel',fn:closeModal},
    {txt:'保存',cls:'btn-primary',fn:function(){
      var inputs=document.querySelectorAll('.catmgr-input');
      var newNames=[];
      inputs.forEach(function(inp){var v=inp.value.trim();if(v&&newNames.indexOf(v)<0)newNames.push(v)});
      if(newNames.length===0){toast('至少保留一个分类');return}
      var oldToNew={};
      inputs.forEach(function(inp,idx){
        var old=categories[idx],neu=inp.value.trim();
        if(neu&&old!==neu)oldToNew[old]=neu;
      });
      categories=newNames;
      dishes.forEach(function(d){
        if(d.category&&oldToNew[d.category])d.category=oldToNew[d.category];
        else if(d.category&&newNames.indexOf(d.category)<0)d.category=newNames[0]||'';
      });
      if(currentCat&&newNames.indexOf(currentCat)<0)currentCat='';
      saveData();renderAll();scheduleSync();closeModal();toast('已保存');
    }}
  ]);
}
function moveCat(i,dir){
  var j=i+dir;
  if(j<0||j>=categories.length)return;
  var tmp=categories[i];categories[i]=categories[j];categories[j]=tmp;
  openCatMgr();
}
function addCatRow(){
  var list=document.querySelector('.catmgr-list');
  if(!list){openCatMgr();return}
  var row=document.createElement('div');
  row.className='catmgr-row';
  row.innerHTML='<input type="text" value="" placeholder="新分类名" class="catmgr-input"><span class="catmgr-cnt">0道</span><button class="catmgr-del" onclick="this.parentNode.remove()" title="删除">✕</button>';
  list.insertBefore(row,list.querySelector('.catmgr-add'));
  row.querySelector('input').focus();
}
function deleteCat(i){
  if(!Array.isArray(categories)||typeof i!=='number'||i<0||i>=categories.length){toast('分类不存在');return}
  if(categories.length<=1){toast('至少保留一个分类');return}
  var removed=categories[i];
  var cnt=dishes.filter(function(d){return deletedIds.indexOf(d.id)<0&&d.category===removed}).length;
  var msg='删除分类「'+removed+'」？';
  if(cnt>0)msg+='该分类下的'+cnt+'道菜会归到第一个分类。';
  showConfirm(msg,function(){
    categories.splice(i,1);
    dishes.forEach(function(d){if(d.category===removed)d.category=categories[0]||''});
    if(currentCat===removed)currentCat='';
    saveData();renderAll();scheduleSync();closeModal();
  });
}
function selectCat(c){currentCat=c;renderCats();renderContent()}
function getFiltered(){
  var q=$('searchInput').value.trim().toLowerCase();
  var list=dishes.filter(function(d){
    if(deletedIds.indexOf(d.id)>=0)return false;
    if(currentView==='menu'&&!d.inMenu)return false;
    if(currentView!=='menu'&&currentCat&&d.category!==currentCat)return false;
    if(q){
      var n=(d.name||'').toLowerCase(),c=(d.category||'').toLowerCase(),desc=(d.desc||'').toLowerCase();
      var tags=(d.tags||[]).join(' ').toLowerCase();
      if(n.indexOf(q)<0&&c.indexOf(q)<0&&desc.indexOf(q)<0&&tags.indexOf(q)<0)return false;
    }
    return true;
  });
  list.sort(function(a,b){return (a.order||a.createdAt||0)-(b.order||b.createdAt||0)});
  return list;
}
function renderContent(){
  if(currentView==='grid')renderGrid();else renderMenu();
}
function renderGrid(){
  var f=getFiltered(),area=$('content');
  if(f.length===0){
    area.innerHTML='<div class="empty"><img src="cat.png?v=25" alt=""><h3>'+(dishes.length===0?'还没有菜品':'没找到匹配的菜')+'</h3><p>'+(dishes.length===0?'点右上角添加，把做过的菜拍下来':'换个关键词试试')+'</p>'+(dishes.length===0?'<button class="btn-add" onclick="openAddModal()">＋ 添加第一道菜</button>':'')+'</div>';
    return;
  }
  var html='<div class="dgrid">';
  f.forEach(function(d){
    var ph=d.photo?'<img class="dphoto" src="'+d.photo+'" loading="lazy">':'<div class="dph">🍽️</div>';
    var tags=(d.tags||[]).slice(0,3).map(function(t){return '<span class="dtag">'+esc(t)+'</span>'}).join('');
    var inMenu=d.inMenu;
    html+='<div class="dcard" data-id="'+d.id+'" onclick="cardClick(event,\''+d.id+'\')" ontouchstart="cardTouchStart(event)" ontouchmove="cardTouchMove(event)" ontouchend="cardTouchEnd(event)" ontouchcancel="cardTouchEnd(event)">'+ 
      '<div class="card-btns">'+ 
        '<button class="card-btn'+(inMenu?' menu-in':'')+'" onclick="event.stopPropagation();toggleInMenu(\''+d.id+'\')" title="加入菜单">'+(inMenu?'✓':'＋')+'</button>'+ 
      '</div>'+ 
      ph+
      '<div class="dinfo">'+ 
        '<div class="dname">'+esc(d.name)+'</div>'+ 
        '<div class="dcat">'+esc(d.category||'未分类')+'</div>'+ 
        (tags?'<div class="dtags">'+tags+'</div>':'')+ 
      '</div>'+ 
    '</div>';
  });
  area.innerHTML=html+'</div>';
}

  var f=getFiltered(),area=$('content');
  if(f.length===0){
    area.innerHTML='<div class="empty"><img src="cat.png?v=25" alt=""><h3>菜单是空的</h3><p>在卡片界面点 ＋ 号把菜加入菜单</p></div>';

function clearMenu(){
  showConfirm('确定要清空菜单吗？\n所有菜会从菜单里移除（菜本身不删），方便明天重新挑选。',function(){
    var cleared=0;
    dishes.forEach(function(d){if(d.inMenu){d.inMenu=false;d.updatedAt=Date.now();cleared++}});
    saveData();scheduleSync();renderContent();
    toast(cleared>0?'已清空 '+cleared+' 道菜':'菜单已经是空的');
  });
}
function switchView(v){
  currentView=v;
  $('tabGrid').classList.toggle('active',v==='grid');
  $('tabMenu').classList.toggle('active',v==='menu');
  $('catBar').style.display=v==='menu'?'none':'';
  var fab=document.querySelector('.fab');
  if(fab)fab.style.display=v==='menu'?'none':'';
  renderContent();
}

// ===== CRUD =====
function showModal(title,bodyHtml,btns){
  $('modalTitle').textContent=title;
  $('dishFormBody').style.display='none';
  $('customBody').innerHTML=bodyHtml||'';
  if($('delBtn'))$('delBtn').style.display='none';
  var btnsEl=$('modalBtns');
  btnsEl.innerHTML='';
  (btns||[{txt:'关闭',cls:'btn-cancel',fn:closeModal}]).forEach(function(b){
    var btn=document.createElement('button');
    btn.className='btn '+b.cls;btn.textContent=b.txt;btn.onclick=b.fn;
    btnsEl.appendChild(btn);
  });
  showOverlay($('modalBg'));
}
function openAddModal(){
  editingId=null;currentPhoto='';
  $('modalTitle').textContent='添加菜品';
  $('dishFormBody').style.display='';
  $('customBody').innerHTML='';
  $('dishName').value='';$('dishCat').value='';$('dishDesc').value='';$('dishTags').value='';
  $('photoPreview').innerHTML='📷 点击上传照片';
  if($('delBtn'))$('delBtn').style.display='none';
  $('modalBtns').innerHTML='<button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveDish()">保存</button>';
  showOverlay($('modalBg'));
}
function editDish(id){
  var d=dishes.find(function(x){return x.id===id});
  if(!d)return;
  editingId=id;currentPhoto=d.photo||'';
  $('modalTitle').textContent='编辑菜品';
  $('dishFormBody').style.display='';
  $('customBody').innerHTML='';
  $('dishName').value=d.name||'';
  $('dishCat').value=d.category||'';
  $('dishDesc').value=d.desc||'';
  $('dishTags').value=(d.tags||[]).join(', ');
  $('photoPreview').innerHTML=currentPhoto?'<img src="'+currentPhoto+'">':'📷 点击上传照片';
  $('modalBtns').innerHTML='<button class="btn btn-danger" onclick="deleteDishFromModal()">删除</button><button class="btn btn-cancel" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveDish()">保存</button>';
  showOverlay($('modalBg'));
}
function closeModal(){
  setTimeout(function(){hideOverlay($('modalBg'))},0);
}
function viewDish(id){
  var d=dishes.find(function(x){return x.id===id});
  if(!d)return;
  var photo=d.photo?'<img class="view-dish-photo" src="'+d.photo+'">':'<div class="view-dish-photo-placeholder">🍽️</div>';
  var desc=d.desc?'<div class="view-dish-desc-label">做法</div><div class="view-dish-desc">'+esc(d.desc)+'</div>':'<div class="view-dish-desc" style="color:var(--tl2);text-align:center">暂无做法记录</div>';
  var tags=(d.tags&&d.tags.length)?'<div style="margin-top:10px;display:flex;gap:4px;flex-wrap:wrap">'+d.tags.map(function(t){return '<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#F0E6D2;color:var(--tl)">'+esc(t)+'</span>'}).join('')+'</div>':'';
  var html=photo+'<div class="view-dish-name">'+esc(d.name)+'</div><div class="view-dish-cat">'+esc(d.category||'未分类')+'</div>'+desc+tags;
  showModal('',html,[{txt:'关闭',cls:'btn-cancel',fn:closeModal}]);
}
var _confirmCallback=null;
function showConfirm(msg,onYes){
  _confirmCallback=onYes;
  showModal('确认','<div class="confirm-msg">'+esc(msg).replace(/\n/g,'<br>')+'</div>',[
    {txt:'取消',cls:'btn-cancel',fn:function(){_confirmCallback=null;closeModal()}},
    {txt:'确定',cls:'btn-primary',fn:function(){var cb=_confirmCallback;_confirmCallback=null;closeModal();if(cb)cb()}}
  ]);
}
function saveDish(){
  var name=$('dishName').value.trim();
  if(!name){toast('请输入菜名');return}
  var cat=$('dishCat').value.trim()||'未分类';
  if(categories.indexOf(cat)<0){categories.push(cat)}
  var tags=$('dishTags').value.split(',').map(function(t){return t.trim()}).filter(Boolean);
  var now=Date.now();
  if(editingId){
    var d=dishes.find(function(x){return x.id===editingId});
    if(d){d.name=name;d.category=cat;d.desc=$('dishDesc').value.trim();d.tags=tags;d.photo=currentPhoto||null;d.updatedAt=now}
  }else{
    dishes.push({id:'d'+now+Math.random().toString(36).substr(2,5),name:name,category:cat,desc:$('dishDesc').value.trim(),tags:tags,photo:currentPhoto||null,createdAt:now,updatedAt:now,order:now,inMenu:false});
  }
  saveData();renderAll();closeModal();scheduleSync();
}
function deleteDishFromModal(){
  if(!editingId)return;
  deleteDish(editingId);
  closeModal();
}
function deleteDish(id){
  deletedIds.push(id);
  dishes=dishes.filter(function(d){return d.id!==id});
  saveData();renderAll();scheduleSync();
}
function toggleInMenu(id){
  var d=dishes.find(function(x){return x.id===id});
  if(!d)return;
  d.inMenu=!d.inMenu;d.updatedAt=Date.now();
  saveData();renderContent();scheduleSync();
  toast(d.inMenu?'已加入菜单':'已移出菜单');
}

// ===== Card Drag Reorder =====
var dragState={id:null,el:null,startY:0,startX:0,timer:null,active:false,suppressClick:false};
function cardClick(e,id){
  if(dragState.suppressClick){dragState.suppressClick=false;return}
  editDish(id);
}
function cardTouchStart(e){
  if(currentView!=='grid')return;
  var card=e.currentTarget;
  var t=e.touches[0];
  dragState.id=card.getAttribute('data-id');
  dragState.el=card;
  dragState.startX=t.clientX;
  dragState.startY=t.clientY;
  dragState.active=false;
  clearTimeout(dragState.timer);
  dragState.timer=setTimeout(function(){
    dragState.active=true;
    dragState.suppressClick=true;
    if(navigator.vibrate)navigator.vibrate(30);
    if(!dragState.el)return;
    dragState.el.classList.add('dragging');
  },450);
}
function cardTouchMove(e){
  if(!dragState.id)return;
  var t=e.touches[0];
  if(!dragState.active){
    if(Math.abs(t.clientY-dragState.startY)>8||Math.abs(t.clientX-dragState.startX)>8){
      clearTimeout(dragState.timer);dragState.id=null;
    }
    return;
  }
  e.preventDefault();
  var dy=t.clientY-dragState.startY;
  dragState.el.style.transform='scale(1.03) translateY('+dy+'px)';
  var elBelow=document.elementFromPoint(t.clientX,t.clientY);
  var cardBelow=elBelow?elBelow.closest('.dcard'):null;
  if(cardBelow&&cardBelow!==dragState.el){
    var rect=cardBelow.getBoundingClientRect();
    var middle=rect.top+rect.height/2;
    var grid=dragState.el.parentNode;
    if(t.clientY<middle){grid.insertBefore(dragState.el,cardBelow)}
    else{grid.insertBefore(dragState.el,cardBelow.nextSibling)}
  }
}
function cardTouchEnd(e){
  clearTimeout(dragState.timer);
  if(dragState.active&&dragState.el){
    var cards=document.querySelectorAll('.dgrid .dcard');
    var order=Date.now();
    cards.forEach(function(card){
      var id=card.getAttribute('data-id');
      var d=dishes.find(function(x){return x.id===id});
      if(d){d.order=order++;d.updatedAt=Date.now()}
    });
    saveData();scheduleSync();
    renderGrid();
  }
  dragState.id=null;dragState.el=null;dragState.active=false;
}

// ===== Photo =====
function handlePhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=800,maxH=800,w=img.width,h=img.height;
      if(w>h){if(w>maxW){h=Math.round(h*maxW/w);w=maxW}}else{if(h>maxH){w=Math.round(w*maxH/h);h=maxH}}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      currentPhoto=c.toDataURL('image/jpeg',0.85);
      $('photoPreview').innerHTML='<img src="'+currentPhoto+'">';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== Sync Settings =====

  var statusText={connected:'已连接，实时同步中',connecting:'正在连接…',disconnected:'未连接（仅本地保存）'}[syncStatus];
  var shareUrl=window.location.origin+window.location.pathname+'?room='+encodeURIComponent(getRoomId());
  var html=
    '<div class="sync-status">'+ 
      '<span class="sdot '+({connected:'green',connecting:'yellow',disconnected:'red'}[syncStatus])+'"></span>'+ 
      '<span class="stext">'+statusText+'</span>'+ 
    '</div>'+ 
    '<div class="sync-tip">'+ 
      '<b>怎么同步？</b><br>'+ 
      '1. 两台设备用同一个「房间号」<br>'+ 
      '2. 把下面的链接发给TA，打开就自动同步<br>'+ 
      '3. 加菜、改菜、加菜单都会实时同步'+ 
    '</div>'+ 
    '<label>房间号</label>'+ 
    '<div class="room-row">'+ 
      '<input type="text" id="roomInput" value="'+esc(getRoomId())+'" placeholder="输入房间号">'+ 
      '<button onclick="saveRoom()">保存</button>'+ 
    '</div>'+ 
    '<label>分享链接</label>'+ 
    '<div class="room-row">'+ 
      '<input type="text" id="shareUrlInput" value="'+esc(shareUrl)+'" readonly>'+ 
      '<button onclick="copyShareUrl()">复制</button>'+ 
    '</div>'+ 
    '<div style="margin-top:12px;display:flex;gap:8px">'+ 
      '<button class="mini-btn" onclick="forceSync()">立即同步</button>'+ 
      '<button class="mini-btn" onclick="exportData()">导出备份</button>'+ 
      '<button class="mini-btn" onclick="document.getElementById(\'importFile\').click()">导入备份</button>'+ 
      '<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">'+ 
    '</div>';
  showModal('同步设置',html,[{txt:'关闭',cls:'btn-cancel',fn:closeModal}]);
}
function saveRoom(){
  var newRoom=$('roomInput').value.trim();
  if(!newRoom){toast('房间号不能为空');return}
  if(newRoom===roomId){toast('房间号未变');return}
  roomId=newRoom;
  localStorage.setItem('room_id',roomId);
  toast('房间号已保存，重新连接…');
  closeModal();
  connectMqtt();
}
function copyShareUrl(){
  var inp=$('shareUrlInput');
  if(!inp)return;
  inp.select();
  try{
    document.execCommand('copy');
    toast('链接已复制，发给TA吧');
  }catch(e){
    if(navigator.clipboard){navigator.clipboard.writeText(inp.value).then(function(){toast('链接已复制，发给TA吧')})}
    else toast('请手动复制');
  }
}
function forceSync(){
  if(syncStatus!=='connected'){toast('未连接，无法同步');return}
  syncPush(true);
  toast('已同步');
}
function exportData(){
  var data=JSON.stringify({dishes:dishes,categories:categories,deletedIds:deletedIds,exportedAt:Date.now()},null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='噗噗菜单备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
  toast('已导出备份');
}
function importData(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d.dishes){toast('备份文件格式不对');return}
      showConfirm('导入将合并备份中的菜品，确定吗？',function(){
        var localMap=new Map(dishes.map(function(x){return[x.id,x]}));
        (d.dishes||[]).forEach(function(inc){
          var loc=localMap.get(inc.id);
          if(!loc||(inc.updatedAt||0)>(loc.updatedAt||0))localMap.set(inc.id,inc);
        });
        dishes=Array.from(localMap.values());
        (d.categories||[]).forEach(function(c){if(categories.indexOf(c)<0)categories.push(c)});
        (d.deletedIds||[]).forEach(function(id){if(deletedIds.indexOf(id)<0)deletedIds.push(id)});
        dishes=dishes.filter(function(x){return deletedIds.indexOf(x.id)<0});
        saveData();renderAll();scheduleSync();
        toast('导入成功，共'+(d.dishes||[]).length+'道菜');
        closeModal();
      });
    }catch(err){toast('导入失败：文件解析错误')}
  };
  reader.readAsText(file);
  event.target.value='';
}

// ===== MQTT Sync =====
function setSyncStatus(status){
  syncStatus=status;
  var dot=$('syncDot');
  if(!dot)return;
  dot.className='dot '+({connected:'green',connecting:'yellow',disconnected:'red'}[status]||'red');
}
function connectMqtt(){
  if(typeof mqtt==='undefined'){
    console.log('[Sync] MQTT library not loaded, local-only mode');
    setSyncStatus('disconnected');
    return;
  }
  if(mqttClient){
    try{mqttClient.end(true)}catch(e){}
    mqttClient=null;
  }
  setSyncStatus('connecting');
  var topic=getTopic();
  var clientId='pupumenu_'+getSenderId()+'_'+Date.now().toString(36);
  try{
    mqttClient=mqtt.connect(MQTT_URL,{
      clientId:clientId,
      clean:true,
      connectTimeout:10000,
      reconnectPeriod:5000,
      keepalive:60
    });
  }catch(e){
    console.log('[Sync] Connect error',e);
    setSyncStatus('disconnected');
    return;
  }
  mqttClient.on('connect',function(){
    console.log('[Sync] Connected to EMQX');
    setSyncStatus('connected');
    mqttClient.subscribe(topic,{qos:1},function(err){
      if(err)console.log('[Sync] Subscribe error',err);
      else console.log('[Sync] Subscribed to',topic);
    });
    // Push local state so others get it (retained message will be updated)
    scheduleSync();
  });
  mqttClient.on('message',function(topic,message){
    try{
      var data=JSON.parse(message.toString());
      if(!data||data.senderId===getSenderId())return;
      // Ignore old messages
      if(data.ts&&data.ts<=lastIncomingTs)return;
      lastIncomingTs=data.ts||Date.now();
      console.log('[Sync] Received state, dishes:',(data.dishes||[]).length);
      var changed=mergeData(data);
      if(changed){saveData();renderAll();toast('已同步更新')}
    }catch(e){console.log('[Sync] Parse error',e)}
  });
  mqttClient.on('reconnect',function(){
    console.log('[Sync] Reconnecting...');
    setSyncStatus('connecting');
  });
  mqttClient.on('close',function(){
    if(syncStatus==='connected'){setSyncStatus('connecting')}
  });
  mqttClient.on('error',function(err){
    console.log('[Sync] Error',err);
    setSyncStatus('disconnected');
  });
  mqttClient.on('offline',function(){
    setSyncStatus('disconnected');
  });
}
function mergeData(incoming){
  if(!incoming)return false;
  var changed=false;
  // Merge deletions
  if(incoming.deletedIds){
    incoming.deletedIds.forEach(function(id){
      if(deletedIds.indexOf(id)<0){deletedIds.push(id);changed=true}
    });
  }
  var before=dishes.length;
  dishes=dishes.filter(function(d){return deletedIds.indexOf(d.id)<0});
  if(dishes.length!==before)changed=true;
  // Merge dishes (LWW by updatedAt)
  var localMap=new Map(dishes.map(function(d){return[d.id,d]}));
  (incoming.dishes||[]).forEach(function(inc){
    if(deletedIds.indexOf(inc.id)>=0)return;
    var loc=localMap.get(inc.id);
    if(!loc||(inc.updatedAt||0)>(loc.updatedAt||0)){
      var merged=Object.assign({},inc);
      if(!merged.photo&&loc&&loc.photo)merged.photo=loc.photo;
      localMap.set(inc.id,merged);
      changed=true;
    }
  });
  dishes=Array.from(localMap.values());
  // Merge categories (union)
  if(incoming.categories){
    incoming.categories.forEach(function(c){
      if(categories.indexOf(c)<0){categories.push(c);changed=true}
    });
  }
  return changed;
}
function scheduleSync(){
  if(syncTimeout)clearTimeout(syncTimeout);
  syncTimeout=setTimeout(function(){syncPush(false)},1500);
}
function syncPush(force){
  if(!mqttClient||syncStatus!=='connected'){
    console.log('[Sync] Not connected, skip push');
    return;
  }
  if(isPushing&&!force)return;
  isPushing=true;
  var payload={
    dishes:dishes.map(function(d){return{
      id:d.id,name:d.name,category:d.category,desc:d.desc,
      tags:d.tags||[],photo:d.photo||null,
      createdAt:d.createdAt,updatedAt:d.updatedAt,
      inMenu:d.inMenu||false,order:d.order||d.createdAt
    }}),
    categories:categories,
    deletedIds:Array.from(new Set(deletedIds)),
    senderId:getSenderId(),
    ts:Date.now()
  };
  var json=JSON.stringify(payload);
  var size=new Blob([json]).size;
  // If too large, strip photos (keep text sync)
  if(size>900000){
    console.log('[Sync] Payload too large ('+size+'), stripping photos');
    payload.dishes=payload.dishes.map(function(d){return Object.assign({},d,{photo:null})});
    json=JSON.stringify(payload);
  }
  mqttClient.publish(getTopic(),json,{qos:1,retain:true},function(err){
    isPushing=false;
    if(err)console.log('[Sync] Push error',err);
    else console.log('[Sync] Pushed, dishes:',payload.dishes.length,'size:',json.length);
  });
}

// ===== Init =====
function init(){
  var savedVer=parseInt(localStorage.getItem('app_ver')||'0');
  if(savedVer<APP_VERSION){
    localStorage.setItem('app_ver',String(APP_VERSION));
    // Clear old cache
    if('caches' in window){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k)})})}
    if(savedVer>0){location.reload();return}
  }
  getSenderId();
  getRoomId();
  loadData();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js?v=31').catch(function(e){console.log('SW err',e)});
  }
  renderAll();
  waitForMqtt(connectMqtt);
  // Reconnect when page becomes visible again
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&mqttClient&&syncStatus!=='connected'){
      try{mqttClient.reconnect()}catch(e){connectMqtt()}
    }
  });
  // Close modals with Escape
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if($('randomModal').classList.contains('show'))closeRandom();
      else if($('modalBg').classList.contains('show'))closeModal();
    }
  });
}
function waitForMqtt(cb){
  if(typeof mqtt!=='undefined'){cb();return}
  var tries=0;
  var t=setInterval(function(){
    tries++;
    if(typeof mqtt!=='undefined'){clearInterval(t);cb()}
    else if(tries>100){clearInterval(t);setSyncStatus('disconnected')}
  },100);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
</script>
