<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贺智康 &amp; 朱锦玲 婚礼请柬</title>
<meta name="description" content="谨定于2026年10月25日为小儿贺智康与朱锦玲女士举行结婚典礼，敬备喜宴，恭请光临。">
<meta property="og:type" content="website">
<meta property="og:title" content="贺智康 & 朱锦玲 婚礼请柬">
<meta property="og:description" content="谨定于2026年10月25日晚六时三十分，敬备喜宴，恭请光临">
<meta property="og:image" content="https://pupumenu.github.io/pupumenu-menu/wedding/banner.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#7e0f13}
body{
  font-family:"STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC","SimSun",serif;
  min-height:100vh;display:flex;justify-content:center;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,190,120,.14),transparent 55%),
    #7e0f13;
  padding:26px 14px 40px;
}
.card{
  width:100%;max-width:430px;position:relative;
  background:linear-gradient(160deg,#a3181d 0%,#8e1418 45%,#7a0f13 100%);
  border:1px solid #d8a94e;
  box-shadow:0 0 0 6px #a3181d,0 0 0 7px #d8a94e,0 18px 40px rgba(0,0,0,.5);
  padding:38px 26px 34px;
}
/* 内金色细框 */
.card::before{
  content:"";position:absolute;inset:10px;pointer-events:none;
  border:1px solid rgba(216,169,78,.65);
}
/* 四角花纹 */
.corner{position:absolute;width:26px;height:26px;pointer-events:none;opacity:.9}
.corner::before,.corner::after{content:"";position:absolute;background:#d8a94e}
.corner::before{width:100%;height:2px}
.corner::after{width:2px;height:100%}
.c-tl{top:16px;left:16px}
.c-tr{top:16px;right:16px;transform:rotate(90deg)}
.c-br{bottom:16px;right:16px;transform:rotate(180deg)}
.c-bl{bottom:16px;left:16px;transform:rotate(270deg)}

/* 囍 */
.shuangxi{
  text-align:center;font-size:88px;color:#e8c05e;line-height:1;margin-bottom:6px;
  text-shadow:0 0 14px rgba(232,192,94,.45),0 2px 0 rgba(0,0,0,.28);
  font-family:"STKaiti","KaiTi","楷体",serif;font-weight:700;
}
.xi-sub{
  text-align:center;color:#e8c05e;font-size:15px;letter-spacing:10px;text-indent:10px;
  margin-bottom:26px;opacity:.92;
}
.divider{display:flex;align-items:center;gap:10px;margin:0 4px 24px}
.divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#d8a94e)}
.divider .line:last-child{background:linear-gradient(270deg,transparent,#d8a94e)}
.divider .dot{color:#d8a94e;font-size:13px}

/* 正文 */
.text{color:#f7e3c3;font-size:15px;line-height:2.25;letter-spacing:1.5px;text-align:center;text-indent:0}
.text .em{color:#e8c05e}
.couple-line{margin:14px 0 4px;font-size:27px;letter-spacing:6px;color:#e8c05e;text-align:center;
  text-shadow:0 0 10px rgba(232,192,94,.35);font-weight:700;}
.couple-line .he{color:#f7e3c3;font-size:19px;letter-spacing:2px;opacity:.9}

.info{margin:22px auto 0;max-width:330px}
.info .row{display:flex;justify-content:center;gap:8px;color:#f7e3c3;font-size:17px;
  letter-spacing:2px;line-height:2;margin-bottom:4px;flex-wrap:wrap}
.info .k{color:#e8c05e;letter-spacing:6px;text-indent:6px}
.addr-tip{text-align:center;color:#d8a94e;font-size:13px;letter-spacing:4px;margin-top:10px;opacity:.85}

/* 署名 */
.sign{margin-top:30px;text-align:center;color:#f7e3c3;font-size:19px;letter-spacing:4px;line-height:2}
.sign .who{color:#e8c05e;font-size:21px;letter-spacing:6px}

/* 底部小字 */
.foot{
  margin-top:26px;text-align:center;color:#c99a4e;font-size:12px;letter-spacing:3px;opacity:.8;
}
@media(max-width:380px){
  .shuangxi{font-size:72px}
  .couple-line{font-size:23px;letter-spacing:4px}
  .text{font-size:17.5px;letter-spacing:2px}
}
</style>
</head>
<body>
<div class="card">
  <span class="corner c-tl"></span><span class="corner c-tr"></span>
  <span class="corner c-br"></span><span class="corner c-bl"></span>

  <div class="shuangxi">囍</div>
  <div class="xi-sub">结　婚　请　柬</div>

  <div class="divider"><span class="line"></span><span class="dot">❖</span><span class="line"></span></div>

  <div class="text">
    谨定于公历二〇二六年<br>
    十月二十五日（星期日）<br>
    晚六时三十分<br>
    为小儿 <span class="em">贺智康</span> 与 <span class="em">朱锦玲</span> 女士<br>
    举行结婚典礼
  </div>

  <div class="couple-line">智康 <span class="he">与</span> 锦玲</div>

  <div class="text" style="margin-top:4px">敬备喜宴&nbsp;&nbsp;恭请光临</div>

  <div class="divider" style="margin-top:22px"><span class="line"></span><span class="dot">❖</span><span class="line"></span></div>

  <div class="info">
    <div class="row"><span class="k">席设</span><span>韶关市武江区惠民南路50号</span></div>
    <div class="row"><span style="visibility:hidden">席设</span><span>中环广场 · 小康生活宴会厅</span></div>
    <div class="row"><span class="k">时间</span><span>2026年10月25日 18:30</span></div>
  </div>

  <div class="addr-tip">恭候光临&nbsp;·&nbsp;敬备喜筵</div>

  <div class="sign">
    <div class="who">贺府双亲</div>
    <div>敬&nbsp;邀</div>
  </div>

  <div class="foot">您的光临是我们最大的荣幸</div>
</div>
</body>
</html>
