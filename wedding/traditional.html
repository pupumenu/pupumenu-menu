<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:#5e0e10;
  font-family:"STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC","SimSun",serif;
  min-height:100vh;overflow-x:hidden;
}
body{
  display:flex;justify-content:center;align-items:flex-start;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,200,140,.18),transparent 60%),
    radial-gradient(ellipse at 50% 100%,rgba(120,20,20,.4),transparent 60%),
    linear-gradient(180deg,#7e0f13 0%,#5a0a0d 100%);
  padding:18px 14px 60px;
  position:relative;
  overflow:hidden;
}

/* =================== 背景：飘金粉 =================== */
.spark{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.dust-p{
  position:absolute;top:-10vh;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#fff6c8 0%,#f5d36a 60%,transparent 100%);
  box-shadow:0 0 6px rgba(255,210,120,.8),0 0 14px rgba(255,180,80,.4);
  animation:fall linear infinite;
  opacity:0;
}
@keyframes fall{
  0%{transform:translateY(0) translateX(0) scale(.4);opacity:0}
  10%{opacity:1}
  90%{opacity:.9}
  100%{transform:translateY(115vh) translateX(var(--dx,0)) scale(1.1);opacity:0}
}

/* 卡片 */
.card{
  width:100%;max-width:430px;position:relative;z-index:5;
  background:linear-gradient(160deg,#a3181d 0%,#8e1418 45%,#6e0d11 100%);
  border:1px solid #d8a94e;
  box-shadow:0 0 0 6px #a3181d,0 0 0 7px #d8a94e,0 18px 50px rgba(0,0,0,.55);
  padding:34px 24px 30px;
  animation:cardIn 1.2s cubic-bezier(.2,.7,.3,1.2) both;
}
@keyframes cardIn{
  0%{opacity:0;transform:translateY(40px) scale(.94);filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* 内金色细框 */
.card::before{
  content:"";position:absolute;inset:10px;pointer-events:none;
  border:1px solid rgba(216,169,78,.7);
}
/* 顶部金色光带 - 走马灯效果 */
.card::after{
  content:"";position:absolute;left:10px;right:10px;top:10px;height:1px;
  background:linear-gradient(90deg,transparent 0%,#fff5c0 30%,#d8a94e 50%,#fff5c0 70%,transparent 100%);
  background-size:200% 100%;
  animation:shineLine 3.5s linear infinite;
  pointer-events:none;z-index:2;
}
@keyframes shineLine{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* 四角花纹 */
.corner{position:absolute;width:30px;height:30px;pointer-events:none;opacity:.95;z-index:3}
.corner::before,.corner::after{content:"";position:absolute;background:#d8a94e}
.corner::before{width:100%;height:2px;box-shadow:0 0 4px rgba(232,192,94,.6)}
.corner::after{width:2px;height:100%;box-shadow:0 0 4px rgba(232,192,94,.6)}
.c-tl{top:14px;left:14px}
.c-tr{top:14px;right:14px;transform:rotate(90deg)}
.c-br{bottom:14px;right:14px;transform:rotate(180deg)}
.c-bl{bottom:14px;left:14px;transform:rotate(270deg)}

/* 烛火（顶部两侧） */
.candle{position:absolute;top:-12px;width:18px;height:34px;z-index:4}
.candle::before{content:"";position:absolute;bottom:0;left:3px;width:12px;height:18px;
  background:linear-gradient(180deg,#f7e3c3,#d8a94e);border-radius:2px;box-shadow:inset 0 0 4px rgba(255,220,140,.8)}
.flame{position:absolute;left:5px;bottom:14px;width:8px;height:14px;
  background:radial-gradient(ellipse at 50% 80%,#fff7d0 0%,#ffcb52 50%,#ff7a26 80%,transparent 100%);
  border-radius:50% 50% 30% 30% / 60% 60% 40% 40%;
  filter:blur(.5px);
  transform-origin:50% 100%;
  animation:flicker .6s ease-in-out infinite alternate;
}
.flame::after{content:"";position:absolute;inset:-6px;
  background:radial-gradient(circle,rgba(255,180,80,.45) 0%,transparent 70%);border-radius:50%;
  animation:flickerGlow 1.4s ease-in-out infinite alternate;
}
@keyframes flicker{
  0%{transform:scale(1) rotate(-4deg) translateY(0)}
  50%{transform:scale(1.1,.95) rotate(3deg) translateY(-1px)}
  100%{transform:scale(.92,1.05) rotate(-2deg) translateY(.5px)}
}
@keyframes flickerGlow{
  0%{opacity:.6;transform:scale(1)}
  100%{opacity:1;transform:scale(1.4)}
}
.candle.l{left:30px}
.candle.r{right:30px}

/* 囍 */
.shuangxi-wrap{position:relative;text-align:center;margin-bottom:6px;margin-top:8px}
.shuangxi{
  display:inline-block;font-size:88px;color:#e8c05e;line-height:1;
  font-family:"STKaiti","KaiTi","楷体",serif;font-weight:700;
  text-shadow:0 0 14px rgba(232,192,94,.5),0 0 28px rgba(232,130,0,.45),0 2px 0 rgba(0,0,0,.3);
  animation:xiBreath 2.6s ease-in-out infinite,xiFlash 5s ease-in-out infinite;
  position:relative;
}
.shuangxi::before{
  content:"";position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,120,.35) 0%,transparent 60%);
  animation:xiHalo 2.6s ease-in-out infinite;
  z-index:-1;
}
@keyframes xiBreath{
  0%,100%{filter:brightness(1) drop-shadow(0 0 6px rgba(255,180,80,.6))}
  50%{filter:brightness(1.2) drop-shadow(0 0 14px rgba(255,210,120,.9))}
}
@keyframes xiFlash{
  0%,90%,100%{color:#e8c05e}
  93%{color:#fff5c0}
}
@keyframes xiHalo{
  0%,100%{opacity:.4;transform:scale(.9)}
  50%{opacity:.85;transform:scale(1.15)}
}
.xi-sub{

}

.divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#d8a94e)}
.divider .line:last-child{background:linear-gradient(270deg,transparent,#d8a94e)}

/* 正文 */

.text .em{color:#e8c05e}
.text .ch{

.text .ch.on{animation:chIn .4s cubic-bezier(.3,.6,.4,1.4) forwards}

/* 印章 */

  display:inline-block;width:62px;height:62px;line-height:60px;
  border:3px solid #c8161d;border-radius:6px;

}
.seal::before{content:"";position:absolute;inset:-1px;border:1px solid rgba(200,22,29,.5);border-radius:6px}
@keyframes sealDrop{
  0%{transform:rotate(-8deg) translateY(-50px);opacity:0}

.fw1{left:20%;background:radial-gradient(circle,#fff5c0,#ffae3a 60%,transparent 100%);animation-delay:.8s}

.xi-rays{display:none}

<script>
/* =========== 逐字显现（预渲染撑布局，再依次点亮，高度不变） =========== */
function typewriter(el, startDelay, step){
  // 1. 拆文本节点：每个字符包一个 span.ch（保留 <br> 与 .em 结构）
  var chars = [];
  var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  var nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    var frag = document.createDocumentFragment();
    Array.from(n.textContent).forEach(function(ch){
      if(/\s/.test(ch)){ frag.appendChild(document.createTextNode('\u00A0')); return; }
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch;
      chars.push(s);
      frag.appendChild(s);
    });
    n.parentNode.replaceChild(frag, n);
  });
  // 2. 按序点亮
  setTimeout(function(){
    chars.forEach(function(s, i){
      setTimeout(function(){ s.classList.add('on'); }, i * step);
    });
  }, startDelay);
}
typewriter(document.getElementById('t1'), 700, 35);

/* =========== 复制地址 =========== */
var ADDR = '广东省韶关市武江区惠民南路50号中环广场（小康生活宴会厅）';
function copyAddr(){
  function ok(){
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ADDR).then(ok).catch(function(){ fallback(); });
  }else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = ADDR;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ prompt('请手动复制：', ADDR); }
    document.body.removeChild(ta);
  }
}

/* =========== 飘金粉 =========== */
var spark = document.getElementById('spark');
for(var i=0;i<24;i++){
  var d = document.createElement('span');
  d.className = 'dust-p';
  d.style.left = Math.random()*100 + '%';
  d.style.setProperty('--dx', (Math.random()*80-20) + 'px');
  d.style.animationDuration = (6 + Math.random()*7) + 's';
  d.style.animationDelay = (-Math.random()*10) + 's';
  d.style.width = d.style.height = (3 + Math.random()*4) + 'px';
  spark.appendChild(d);
}

/* =========== 四彩花瓣雨 =========== */
var petalColors = [
  'radial-gradient(circle at 30% 30%,#ffd1d6,#ff4a6a 60%,#a31830 100%)',
  'radial-gradient(circle at 30% 30%,#fff5c0,#f2d78e 60%,#b8862a 100%)',
  'radial-gradient(circle at 30% 30%,#ffd0a0,#ff8c42 60%,#c54a18 100%)',
  'radial-gradient(circle at 30% 30%,#ffc8e0,#ff5fa3 60%,#a8306a 100%)'
];
var petalsBox = document.getElementById('petals');
for(var i=0;i<22;i++){
  var p = document.createElement('span');
  p.className = 'petal';
  p.style.left = Math.random()*100 + '%';
  p.style.background = petalColors[Math.floor(Math.random()*petalColors.length)];
  p.style.setProperty('--dx', (Math.random()*160-80) + 'px');
  p.style.animationDuration = (8 + Math.random()*9) + 's';
  p.style.animationDelay = (-Math.random()*14) + 's';
  p.style.transform = 'scale(' + (0.6 + Math.random()*0.7) + ')';
  petalsBox.appendChild(p);
}

/* =========== 点击放大囍字 =========== */
document.querySelector('.shuangxi').addEventListener('click',function(){
  this.style.transition='transform .5s';
  this.style.transform='scale(1.18)';
  setTimeout(()=>this.style.transform='scale(1)',350);
});
